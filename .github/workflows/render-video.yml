name: Cinema AI Telegram Film Studio

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Topic, story, or full script'
        required: true
      format:
        description: 'vertical (9:16) or landscape (16:9)'
        required: false
        default: 'vertical'
  repository_dispatch:
    types: [telegram_video_request]

jobs:
  produce-and-deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore reusable media cache
        uses: actions/cache@v4
        with:
          path: .cache/cinema-media
          key: cinema-media-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cinema-media-v1-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect available compute without downloading models
        run: python scripts/hardware_doctor.py --output out/hardware_report.json

      - name: Inspect model admission without downloading weights
        run: python scripts/model_router.py --output out/model_admission.json

      - name: Install Remotion Engine and Python Audio Tools
        run: |
          npm ci
          pip install -r requirements.txt
          if ! command -v ffmpeg >/dev/null || ! command -v tesseract >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core fonts-lato fonts-liberation2 fonts-noto-core fonts-noto-color-emoji
          fc-cache -f

      - name: Verify media and audio tools
        run: python -c "import auto_editor, gradio_client, gtts, librosa, mutagen, soundfile; print('media and audio dependencies ready')"

      - name: Fetch and analyze user-supplied Telegram reference
        if: github.event.client_payload.reference_file_id != ''
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CINEMA_REFERENCE_VISION_MODEL: ${{ vars.CINEMA_REFERENCE_VISION_MODEL }}
          REFERENCE_FILE_ID: ${{ github.event.client_payload.reference_file_id }}
          REFERENCE_KIND: ${{ github.event.client_payload.reference_kind }}
          REFERENCE_MIME_TYPE: ${{ github.event.client_payload.reference_mime_type }}
          FORMAT: ${{ github.event.inputs.format || github.event.client_payload.format || 'vertical' }}
        run: |
          python scripts/fetch_telegram_reference.py \
            --file-id "$REFERENCE_FILE_ID" \
            --kind "$REFERENCE_KIND" \
            --mime-type "$REFERENCE_MIME_TYPE" \
            --output-dir out/reference_media \
            --manifest out/reference_manifest.json
          python scripts/reference_analyzer.py \
            --manifest out/reference_manifest.json \
            --output out/reference_style.json \
            --contact-sheet-dir out/reference_frames \
            --crop-to "$FORMAT"

      - name: Prepare compact audio vault
        run: python scripts/setup_real_audio.py

      - name: Record production start time
        run: echo "CINEMA_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Direct Film, Fetch AI Cinema Visuals, Synthesize Voice & Score
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORMAT: ${{ github.event.inputs.format || github.event.client_payload.format || 'vertical' }}
          PROMPT: ${{ github.event.inputs.prompt || github.event.client_payload.text }}
          PROMPT_CONTEXT: ${{ github.event.client_payload.prompt_context }}
          CINEMA_JOB_ID: ${{ github.event.client_payload.request_id || github.run_id }}
          CINEMA_MAX_VIDEO_CLIPS: '5'
          CINEMA_VIDEO_CLIP_TIMEOUT: '45'
          PREFER_GEMINI: '1'
          CINEMA_BRAND_PROFILE: 'IFXTRADES'
          CINEMA_RESEARCH_ALL_IFX: '1'
        run: |
          if [ -f out/reference_style.json ]; then
            export PROMPT_CONTEXT="$(python scripts/reference_context.py --report out/reference_style.json --existing "$PROMPT_CONTEXT")"
          fi
          python scripts/generate_assets.py

      - name: Render Cinema Master MP4
        run: |
          FORMAT=$(python -c 'import json; print(json.load(open("public/video_data.json", encoding="utf-8"))["format"])')
          if [ "$FORMAT" = "landscape" ]; then
            npm run build:landscape
            mv out/final_16x9.mp4 out/final.mp4
          else
            npm run build
          fi

      - name: Enforce MP4 and text-overlap quality gate
        run: python scripts/render_quality_gate.py --video out/final.mp4 --report out/render_quality_report.json --ocr

      - name: Generate cover and social publishing package
        run: python scripts/post_production.py --video out/final.mp4 --data public/video_data.json --output-dir out

      - name: Record measured production telemetry
        if: always()
        run: python scripts/cost_ledger.py --output out/final.mp4 --video-data public/video_data.json --hardware-report out/hardware_report.json --ledger out/production_ledger.jsonl

      - name: Preserve lightweight production telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-production-telemetry-${{ github.run_id }}
          path: |
            out/final.mp4
            out/telegram_caption.txt
            out/cover.jpg
            out/hardware_report.json
            out/model_admission.json
            out/production_ledger.jsonl
            out/render_quality_report.json
            out/reference_style.json
            out/reference_frames/**
            out/reference_crops/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Deliver Film and Generated Caption to Telegram Phone Chat
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/deliver_video.py --video out/final.mp4 --caption-file out/telegram_caption.txt --thumbnail out/cover.jpg

      - name: Notify Telegram when generation fails
        if: failure()
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram failure notification skipped: bot token or chat ID is not configured."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 2 \
            -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=Your video could not be completed. Check the GitHub Actions run for the error: $RUN_URL"
